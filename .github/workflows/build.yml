name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set),
      # so no SDK setup step is needed.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AlbumArtLockScreen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlbumArtLockScreen
          path: AlbumArtLockScreen.apk

      # Every build on main replaces the "latest" release, so the phone can always
      # download the newest APK from the same link.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AlbumArtLockScreen.apk \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download AlbumArtLockScreen.apk on your phone to install or update."
